# -> ~/.config/systemd/user/tmux-spawn-.scope.d/50-tmux-keeper.conf
# tmux (3.4+ built with systemd) runs every pane in its own transient
# tmux-spawn-<uuid>.scope. At shutdown systemd stopped those in parallel with
# tmux-server.service, so the panes (and the Claude in them) died and the tmux
# server exited before tmux-server's ExecStop could save. This prefix drop-in
# applies to every tmux-spawn-*.scope: ordering it Before= the server means
# the server stops (and saves) first, and the panes stop after.
[Unit]
Before=tmux-server.service
