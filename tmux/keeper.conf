# tmux-keeper: session restore + Claude Code resume. Sourced from ~/.tmux.conf.
# tmux-resurrect/continuum restore the layout; tmux-keeper resumes Claude Code.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-keeper save'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-keeper resume'

# Restore automatically when the tmux server starts (tmux.service at boot).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
